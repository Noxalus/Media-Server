    hostname: sonarr-series
    volumes:
      - ${PATH_DOCKER}/sonarr-series/config:/config
      - ${PATH_DOWNLOAD}:/downloads
      - ${PATH_MEDIA}/Cartoons:/cartoons
      - ${PATH_MEDIA}/Documentaries/Series:/documentaries
      - ${PATH_MEDIA}/Emissions:/emissions
