  #############
  pinchflat:
    container_name: pinchflat
    image: ghcr.io/kieraneglin/pinchflat:latest
    restart: unless-stopped
    environment:
      - TZ=${TIME_ZONE}
    ports:
      - '8945:8945'
    volumes:
      - ${PATH_DOCKER}/pinchflat/config:/config
      - ${PATH_MEDIA}/Youtube:/downloads
    networks:
      - mediastack
  ############
  # Yamtrack #
  ############
  yamtrack:
    container_name: yamtrack
    image: ghcr.io/fuzzygrim/yamtrack
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=${TIME_ZONE}
      - SECRET=${YAMTRACK_SECRET}
      - REDIS_URL=redis://redis:6379
      - STEAM_API_KEY=${YAMTRACK_STEAM_API_KEY}
    volumes:
      - ${PATH_DOCKER}/yamtrack/db:/yamtrack/db
    ports:
      - "8000:8000"
    networks:
      - mediastack
  #########
